# Cloudflare Pages configuration
# For MedExplainer static site + Functions

# This is for Cloudflare Pages - no need for wrangler.toml actually
# Just place this in your project root for reference

# Static files are served from public/
# Functions are in functions/

# To deploy:
# 1. Go to Cloudflare Dashboard > Pages
# 2. Create a new project
# 3. Connect your GitHub repository
# 4. Set project name: medexplainer
# 5. Set production branch: main (or vibe/medexplainer-747139)
# 6. Set build command: (leave empty)
# 7. Set build output directory: medexplainer/public
# 8. Add environment variables if needed

# For local testing with wrangler (optional):
# wrangler pages dev medexplainer/public --local
