[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "git-hotspots"
dynamic = ["version"]
description = "Find the riskiest files in a codebase: git churn × code complexity, bus factor, TODO debt."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["colorama>=0.4.6"]
keywords = ["git", "code-quality", "hotspots", "technical-debt", "refactoring"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
web = ["fastapi>=0.100.0", "uvicorn>=0.23.0", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
git-hotspots = "git_hotspots.cli:main"

[project.urls]
Homepage = "https://github.com/smmisha/project-zero"

[tool.setuptools]
packages = ["git_hotspots"]

[tool.setuptools.dynamic]
version = { attr = "git_hotspots.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
